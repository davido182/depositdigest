name: Build Android AAB

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'Version code (integer, must be higher than previous)'
        required: true
        default: '2'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle) ─────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 4. Install JS deps ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Build web assets ──────────────────────────────────────────────
      - name: Build web (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_STRIPE_PUBLISHABLE_KEY }}

      # ── 6. Sync Capacitor → Android ──────────────────────────────────────
      - name: Capacitor add & sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      # ── 7. Bump versionCode & versionName in build.gradle ────────────────
      - name: Set version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle
          echo "Updated build.gradle:"
          grep -E "versionCode|versionName" android/app/build.gradle

      # ── 8. Decode keystore from secret ───────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/rentaflux-release.jks

      # ── 9. Build release AAB ─────────────────────────────────────────────
      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/rentaflux-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      # ── 10. Upload AAB as artifact ────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rentaflux-v${{ github.event.inputs.version_name }}-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ Android AAB built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "- Download the AAB from the **Artifacts** section above" >> $GITHUB_STEP_SUMMARY
          echo "- Upload it manually to Google Play Console → Production → New release" >> $GITHUB_STEP_SUMMARY
