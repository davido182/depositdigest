name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      version_code:
        description: 'Version code — must be higher than previous (last was 2)'
        required: true
        default: '3'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node 24 (replaces deprecated Node 20) ─────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 4. Install JS dependencies ───────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Build web assets (Vite) ───────────────────────────────────
      - name: Build web (Vite production)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NAME: RentaFlux
          VITE_APP_VERSION: ${{ github.event.inputs.version_name }}
          VITE_APP_DOMAIN: https://www.rentaflux.com
          NODE_ENV: production

      # ── 6. Verify android/ platform exists ───────────────────────────
      #    android/ is committed to the repo — skip "cap add", go direct to sync
      - name: Verify Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android/ folder not found in repo."
            exit 1
          fi
          echo "android/ found — skipping cap add, proceeding to sync"

      # ── 7. Sync web assets to Android ────────────────────────────────
      - name: Capacitor — sync web assets to Android
        run: npx cap sync android

      # ── 8. Bump versionCode & versionName in build.gradle ────────────
      - name: Set version numbers
        run: |
          FILE="android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" "$FILE"
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.version_name }}"/' "$FILE"
          echo "=== build.gradle version lines ==="
          grep -E "versionCode|versionName" "$FILE"

      # ── 9. Decode keystore ───────────────────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/rentaflux-release.jks
          echo "Keystore size: $(wc -c < android/app/rentaflux-release.jks) bytes"

      # ── 10. Build release AAB ────────────────────────────────────────
      - name: Build release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/rentaflux-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # ── 11. Upload AAB ───────────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rentaflux-v${{ github.event.inputs.version_name }}-(${{ github.event.inputs.version_code }}).aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 12. Summary ──────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "## ✅ Android AAB ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.event.inputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version code | ${{ github.event.inputs.version_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | com.rentaflux.app |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **.aab** from the Artifacts section above and upload to Google Play Console." >> $GITHUB_STEP_SUMMARY
